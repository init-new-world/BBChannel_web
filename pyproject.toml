[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbchannel-web"
version = "0.1.0"
description = "Web proof of concept for BBchannel device connection and recognition."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["webapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
